name: Build VIP Weapon FOV

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/pisex/ubuntu20:latest

    env:
      HL2SDK_ROOT: "${{ github.workspace }}/external"
      MMS_PATH: "${{ github.workspace }}/external/metamod-source"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          echo "================================"
          echo "WORKSPACE:"
          echo "$GITHUB_WORKSPACE"
          echo "================================"

          pwd

          echo "===== FILES ====="
          find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort | head -300

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive

          apt-get update -qy

          apt-get install -y \
            git \
            binutils \
            python3 \
            python3-pip \
            build-essential \
            clang \
            protobuf-compiler \
            zip

          python3 -m pip install --upgrade \
            pip \
            importlib-metadata

          python3 -m pip install \
            setuptools==45.2.0

      - name: Install AMBuild
        run: |
          rm -rf /tmp/ambuild

          git clone \
            https://github.com/alliedmodders/ambuild.git \
            /tmp/ambuild

          cd /tmp/ambuild

          pip3 install .

          echo "===== AMBUILD ====="
          which ambuild
          ambuild --version || true

      - name: Download Metamod Source
        run: |
          mkdir -p "$HL2SDK_ROOT"

          rm -rf "$MMS_PATH"

          git clone \
            --recursive \
            --branch master \
            --single-branch \
            https://github.com/alliedmodders/metamod-source.git \
            "$MMS_PATH"

          echo "===== METAMOD ====="
          ls -la "$MMS_PATH"

      - name: Download CS2 HL2SDK
        run: |
          rm -rf "$HL2SDK_ROOT/hl2sdk-cs2"

          git clone \
            --recursive \
            --branch cs2 \
            --single-branch \
            https://github.com/alliedmodders/hl2sdk.git \
            "$HL2SDK_ROOT/hl2sdk-cs2"

          echo "===== HL2SDK ====="
          ls -la "$HL2SDK_ROOT/hl2sdk-cs2"

          echo "===== ENTITY2 ====="
          ls -la "$HL2SDK_ROOT/hl2sdk-cs2/entity2" || true

          echo "===== TIER0 ====="
          ls -la "$HL2SDK_ROOT/hl2sdk-cs2/public/tier0" || true

      - name: Download SchemaEntity
        run: |
          SCHEMA_DIR="$(dirname "$GITHUB_WORKSPACE")/SchemaEntity"

          rm -rf "$SCHEMA_DIR"

          git clone \
            https://github.com/Pisex/SchemaEntity.git \
            "$SCHEMA_DIR"

          echo "SchemaEntity location:"
          echo "$SCHEMA_DIR"

          echo "===== BEFORE PATCH ====="
          ls -la "$SCHEMA_DIR" | head -100

          # Fix compatibility with current SDK.
          sed -i \
            's/NetworkStateChanged_t/NetworkStateChangedData/g' \
            "$SCHEMA_DIR/schemasystem.cpp"

          sed -i \
            's/FL_PAWN_FAKECLIENT/FL_FAKECLIENT/g' \
            "$SCHEMA_DIR/CCSPlayerPawn.h"

          sed -i \
            's/FL_CONTROLLER_FAKECLIENT/FL_FAKECLIENT/g' \
            "$SCHEMA_DIR/CCSPlayerController.h"

          echo "===== SCHEMA READY ====="
          test -f "$SCHEMA_DIR/schemasystem.cpp"
          test -f "$SCHEMA_DIR/CCSPlayerPawn.h"
          test -f "$SCHEMA_DIR/CCSPlayerController.h"

      - name: Verify plugin files
        run: |
          echo "===== VERIFY PLUGIN ====="

          test -f "$GITHUB_WORKSPACE/configure.py"
          echo "configure.py OK"

          test -f "$GITHUB_WORKSPACE/AMBuildScript"
          echo "AMBuildScript OK"

          test -f "$GITHUB_WORKSPACE/AMBuilder"
          echo "AMBuilder OK"

          test -f "$GITHUB_WORKSPACE/vip_viewmodelfov.cpp"
          echo "vip_viewmodelfov.cpp OK"

          test -f "$GITHUB_WORKSPACE/vip_viewmodelfov.h"
          echo "vip_viewmodelfov.h OK"

          test -d "$GITHUB_WORKSPACE/hl2sdk-manifests"
          echo "hl2sdk-manifests OK"

          echo "===== AMBUILDER ====="
          cat "$GITHUB_WORKSPACE/AMBuilder"

      - name: Configure
        run: |
          rm -rf "$GITHUB_WORKSPACE/build"

          mkdir -p "$GITHUB_WORKSPACE/build"

          cd "$GITHUB_WORKSPACE/build"

          echo "===== CONFIGURING ====="

          python3 ../configure.py \
            -s cs2 \
            --targets x86_64 \
            --enable-optimize \
            --hl2sdk-manifests="$GITHUB_WORKSPACE/hl2sdk-manifests" \
            --mms_path="$MMS_PATH" \
            --hl2sdk-root="$HL2SDK_ROOT"

          echo "===== CONFIGURE RESULT ====="
          find . -maxdepth 3 -type f | sort | head -200

      - name: Build
        run: |
          cd "$GITHUB_WORKSPACE/build"

          echo "================================"
          echo "BUILDING VIP VIEWMODEL FOV"
          echo "================================"

          ambuild

      - name: Show build output
        if: always()
        run: |
          echo "================================"
          echo "SHARED LIBRARIES"
          echo "================================"

          find "$GITHUB_WORKSPACE/build" \
            -type f \
            -name "*.so" \
            -print || true

          echo "================================"
          echo "VDF FILES"
          echo "================================"

          find "$GITHUB_WORKSPACE/build" \
            -type f \
            -name "*.vdf" \
            -print || true

          echo "================================"
          echo "PACKAGE"
          echo "================================"

          find "$GITHUB_WORKSPACE/build/package" \
            -type f \
            -print 2>/dev/null || true

      - name: Create package
        run: |
          rm -rf "$GITHUB_WORKSPACE/artifact"

          mkdir -p "$GITHUB_WORKSPACE/artifact"

          if [ -d "$GITHUB_WORKSPACE/build/package/addons" ]; then

            echo "Using generated AMBuild package"

            cp -r \
              "$GITHUB_WORKSPACE/build/package/addons" \
              "$GITHUB_WORKSPACE/artifact/"

          else

            echo "No package directory - collecting binaries manually"

            mkdir -p \
              "$GITHUB_WORKSPACE/artifact/addons/vip_modules"

            find "$GITHUB_WORKSPACE/build" \
              -type f \
              -name "*.so" \
              -exec cp -v {} \
              "$GITHUB_WORKSPACE/artifact/addons/vip_modules/" \;

            mkdir -p \
              "$GITHUB_WORKSPACE/artifact/addons/metamod"

            find "$GITHUB_WORKSPACE/build" \
              -type f \
              -name "*.vdf" \
              -exec cp -v {} \
              "$GITHUB_WORKSPACE/artifact/addons/metamod/" \;

          fi

          echo "===== ARTIFACT CONTENT ====="

          find "$GITHUB_WORKSPACE/artifact" \
            -type f \
            -print

          cd "$GITHUB_WORKSPACE/artifact"

          zip -r \
            "$GITHUB_WORKSPACE/VIP_ViewmodelFOV-linux.zip" \
            .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VIP_ViewmodelFOV-linux
          path: VIP_ViewmodelFOV-linux.zip
          if-no-files-found: error