name: Build VIP Weapon FOV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pisex/ubuntu20:latest

    env:
      HL2SDK_ROOT: "${{ github.workspace }}/external"
      MMS_PATH: "${{ github.workspace }}/external/metamod-source"
      SCHEMA_DIR: "${{ github.workspace }}/../SchemaEntity"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qy
          apt-get install -y git binutils python3 python3-pip build-essential clang protobuf-compiler zip

          python3 -m pip install --upgrade pip importlib-metadata
          python3 -m pip install setuptools==45.2.0

          rm -rf /tmp/ambuild
          git clone https://github.com/alliedmodders/ambuild.git /tmp/ambuild
          cd /tmp/ambuild
          pip3 install .

      - name: Download Metamod and CS2 HL2SDK
        run: |
          mkdir -p "$HL2SDK_ROOT"

          rm -rf "$MMS_PATH"
          git clone --recursive --branch master --single-branch \
            https://github.com/alliedmodders/metamod-source.git "$MMS_PATH"

          rm -rf "$HL2SDK_ROOT/hl2sdk-cs2"
          git clone --recursive --branch cs2 --single-branch \
            https://github.com/alliedmodders/hl2sdk.git "$HL2SDK_ROOT/hl2sdk-cs2"

          echo "=== Verify SDK files used by AMBuildScript ==="
          for f in \
            public/tier0/memoverride.cpp \
            entity2/entitysystem.cpp \
            entity2/entityidentity.cpp \
            entity2/entitykeyvalues.cpp
          do
            test -f "$HL2SDK_ROOT/hl2sdk-cs2/$f" || {
              echo "Missing SDK source: $f"
              exit 1
            }
          done

      - name: Download and patch SchemaEntity
        run: |
          rm -rf "$SCHEMA_DIR"
          git clone https://github.com/Pisex/SchemaEntity.git "$SCHEMA_DIR"

          sed -i 's/NetworkStateChanged_t/NetworkStateChangedData/g' "$SCHEMA_DIR/schemasystem.cpp"
          sed -i 's/FL_PAWN_FAKECLIENT/FL_FAKECLIENT/g' "$SCHEMA_DIR/CCSPlayerPawn.h"
          sed -i 's/FL_CONTROLLER_FAKECLIENT/FL_FAKECLIENT/g' "$SCHEMA_DIR/CCSPlayerController.h"

      - name: Verify build scripts are current
        run: |
          echo "=== AMBuildScript obsolete source check ==="
          if grep -nE "tier1.*(generichash|convar|keyvalues3)\.cpp" "$GITHUB_WORKSPACE/AMBuildScript"; then
            echo "ERROR: AMBuildScript is still old. Replace it with the fixed file."
            exit 1
          fi

          echo "=== AMBuilder obsolete source check ==="
          if grep -nE "tier1.*(generichash|convar|keyvalues3)\.cpp" "$GITHUB_WORKSPACE/AMBuilder"; then
            echo "ERROR: AMBuilder is still old. Replace it with the fixed file."
            exit 1
          fi

          test -f "$GITHUB_WORKSPACE/vip_viewmodelfov.cpp"
          test -f "$GITHUB_WORKSPACE/vip_viewmodelfov.h"
          test -f "$SCHEMA_DIR/schemasystem.cpp"

      - name: Configure
        run: |
          rm -rf "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/build"
          cd "$GITHUB_WORKSPACE/build"

          python3 ../configure.py \
            -s cs2 \
            --targets x86_64 \
            --enable-optimize \
            --hl2sdk-manifests="$GITHUB_WORKSPACE/hl2sdk-manifests" \
            --mms_path="$MMS_PATH" \
            --hl2sdk-root="$HL2SDK_ROOT"

      - name: Build
        run: |
          cd "$GITHUB_WORKSPACE/build"
          ambuild

      - name: Show output
        if: always()
        run: |
          echo "=== .so ==="
          find "$GITHUB_WORKSPACE/build" -type f -name "*.so" -print || true
          echo "=== package ==="
          find "$GITHUB_WORKSPACE/build/package" -type f -print 2>/dev/null || true

      - name: Package
        if: success()
        run: |
          cd "$GITHUB_WORKSPACE/build/package"
          zip -r "$GITHUB_WORKSPACE/VIP_ViewmodelFOV-linux.zip" addons

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VIP_ViewmodelFOV-linux
          path: VIP_ViewmodelFOV-linux.zip
          if-no-files-found: error
