name: Build VIP Weapon FOV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    env:
      HL2SDK_ROOT: "${{ github.workspace }}/external"
      MMS_PATH: "${{ github.workspace }}/external/metamod-source"
      SCHEMA_DIR: "${{ github.workspace }}/../SchemaEntity"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qy
          sudo apt-get install -y \
            git \
            clang-10 \
            clang++-10 \
            binutils \
            python3 \
            python3-pip \
            zip

          python3 -m pip install --upgrade pip importlib-metadata
          python3 -m pip install setuptools==45.2.0

          rm -rf /tmp/ambuild
          git clone https://github.com/alliedmodders/ambuild.git /tmp/ambuild
          cd /tmp/ambuild
          pip3 install .

      - name: Download dependencies
        run: |
          mkdir -p "$HL2SDK_ROOT"

          rm -rf "$MMS_PATH"
          git clone --recursive --branch master --single-branch \
            https://github.com/alliedmodders/metamod-source.git \
            "$MMS_PATH"

          rm -rf "$HL2SDK_ROOT/hl2sdk-cs2"
          git clone --recursive --branch cs2 --single-branch \
            https://github.com/alliedmodders/hl2sdk.git \
            "$HL2SDK_ROOT/hl2sdk-cs2"

          rm -rf "$SCHEMA_DIR"
          git clone https://github.com/Pisex/SchemaEntity.git "$SCHEMA_DIR"

      - name: Verify current sources
        run: |
          test -f "$GITHUB_WORKSPACE/configure.py"
          test -f "$GITHUB_WORKSPACE/AMBuildScript"
          test -f "$GITHUB_WORKSPACE/AMBuilder"
          test -f "$GITHUB_WORKSPACE/vip_viewmodelfov.cpp"
          test -f "$SCHEMA_DIR/schemasystem.cpp"
          test -f "$SCHEMA_DIR/module.cpp"
          test -f "$SCHEMA_DIR/ctimer.cpp"

          # generichash.cpp/keyvalues3.cpp are obsolete and must not be referenced.
          ! grep -n "generichash.cpp" "$GITHUB_WORKSPACE/AMBuildScript"
          ! grep -n "keyvalues3.cpp" "$GITHUB_WORKSPACE/AMBuildScript"

      - name: Configure
        run: |
          rm -rf "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/build"
          cd "$GITHUB_WORKSPACE/build"

          CC=clang-10 CXX=clang++-10 \
          python3 ../configure.py \
            -s cs2 \
            --targets x86_64 \
            --enable-optimize \
            --hl2sdk-manifests="$GITHUB_WORKSPACE/hl2sdk-manifests" \
            --mms_path="$MMS_PATH" \
            --hl2sdk-root="$HL2SDK_ROOT"

      - name: Build
        run: |
          cd "$GITHUB_WORKSPACE/build"

          # One worker on purpose: if compilation fails, GitHub prints the exact
          # compiler error instead of hiding it among parallel worker output.
          ambuild -j 1

      - name: Show output
        if: always()
        run: |
          echo "===== shared libraries ====="
          find "$GITHUB_WORKSPACE/build" -type f -name "*.so" -print || true
          echo "===== package ====="
          find "$GITHUB_WORKSPACE/build/package" -type f -print 2>/dev/null || true

      - name: Package
        if: success()
        run: |
          cd "$GITHUB_WORKSPACE/build/package"
          zip -r "$GITHUB_WORKSPACE/VIP_ViewmodelFOV-linux.zip" addons

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VIP_ViewmodelFOV-linux
          path: VIP_ViewmodelFOV-linux.zip
          if-no-files-found: error
