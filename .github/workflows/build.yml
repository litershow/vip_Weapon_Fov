name: Build VIP Weapon FOV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/pisex/ubuntu20:latest

    env:
      HL2SDK_ROOT: "${{ github.workspace }}/external"
      MMS_PATH: "${{ github.workspace }}/external/metamod-source"
      SCHEMA_DIR: "${{ github.workspace }}/../SchemaEntity"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AMBuild and tools
        run: |
          export DEBIAN_FRONTEND=noninteractive

          apt-get update -qy
          apt-get install -y \
            git \
            binutils \
            python3 \
            python3-pip \
            clang \
            zip

          python3 -m pip install --upgrade pip importlib-metadata
          python3 -m pip install setuptools==45.2.0

          rm -rf /tmp/ambuild
          git clone https://github.com/alliedmodders/ambuild.git /tmp/ambuild
          cd /tmp/ambuild
          pip3 install .

      - name: Download Metamod, HL2SDK and SchemaEntity
        run: |
          mkdir -p "$HL2SDK_ROOT"

          rm -rf "$MMS_PATH"
          git clone --recursive --branch master --single-branch \
            https://github.com/alliedmodders/metamod-source.git \
            "$MMS_PATH"

          rm -rf "$HL2SDK_ROOT/hl2sdk-cs2"
          git clone --recursive --branch cs2 --single-branch \
            https://github.com/alliedmodders/hl2sdk.git \
            "$HL2SDK_ROOT/hl2sdk-cs2"

          rm -rf "$SCHEMA_DIR"
          git clone https://github.com/Pisex/SchemaEntity.git "$SCHEMA_DIR"

          sed -i 's/NetworkStateChanged_t/NetworkStateChangedData/g' \
            "$SCHEMA_DIR/schemasystem.cpp"

          sed -i 's/FL_PAWN_FAKECLIENT/FL_FAKECLIENT/g' \
            "$SCHEMA_DIR/CCSPlayerPawn.h"

          sed -i 's/FL_CONTROLLER_FAKECLIENT/FL_FAKECLIENT/g' \
            "$SCHEMA_DIR/CCSPlayerController.h"

          python3 - <<'PY'
          from pathlib import Path
          import os

          p = Path(os.environ["SCHEMA_DIR"]) / "globaltypes.h"
          s = p.read_text(encoding="utf-8")

          marker = '#include "soundflags.h"'
          compat = '''
// ---- vip_Weapon_Fov build compatibility ----
// These trace/hitbox helper types are referenced by unrelated
// SchemaEntity headers but are absent from current AM hl2sdk-cs2.
struct Ray_t
{
    unsigned char _opaque[64];
};

class CHitBox;

enum RayType_t : int
{
    RAY_TYPE_COMPAT = 0
};

enum HitGroup_t : int
{
    HITGROUP_COMPAT = 0
};
// ---- end compatibility ----
'''

          if "RAY_TYPE_COMPAT" not in s:
              s = s.replace(marker, marker + "\n" + compat)

          p.write_text(s, encoding="utf-8")
          PY

          echo "===== SchemaEntity compatibility block ====="
          grep -n -A25 -B2 "vip_Weapon_Fov build compatibility" \
            "$SCHEMA_DIR/globaltypes.h"

      - name: Verify sources
        run: |
          test -f AMBuildScript
          test -f AMBuilder
          test -f configure.py
          test -f vip_viewmodelfov.cpp
          test -f vip_viewmodelfov.h

          test -f "$SCHEMA_DIR/schemasystem.cpp"
          test -f "$SCHEMA_DIR/module.cpp"
          test -f "$SCHEMA_DIR/ctimer.cpp"

          # Check only actual Python source entries, not comments mentioning old filenames.
          if grep -nE "os\.path\.join\(.*tier1.*(generichash|keyvalues3)\.cpp" AMBuildScript AMBuilder; then
            echo "ERROR: obsolete SDK source is still referenced as a build source"
            exit 1
          fi

      - name: Configure
        run: |
          rm -rf build
          mkdir build
          cd build

          python3 ../configure.py \
            -s cs2 \
            --targets x86_64 \
            --enable-optimize \
            --hl2sdk-manifests="$GITHUB_WORKSPACE/hl2sdk-manifests" \
            --mms_path="$MMS_PATH" \
            --hl2sdk-root="$HL2SDK_ROOT"

      - name: Build
        run: |
          cd build

          # Serial build = GitHub always shows the exact compiler error if one remains.
          ambuild -j 1

      - name: Package
        if: success()
        run: |
          cd build/package
          zip -r "$GITHUB_WORKSPACE/VIP_ViewmodelFOV-linux.zip" addons

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VIP_ViewmodelFOV-linux
          path: VIP_ViewmodelFOV-linux.zip
          if-no-files-found: error
