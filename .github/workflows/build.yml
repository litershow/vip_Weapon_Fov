name: Build VIP Weapon FOV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/pisex/ubuntu20:latest

    env:
      HL2SDK_ROOT: "${{ github.workspace }}/external"
      MMS_PATH: "${{ github.workspace }}/external/metamod-source"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qy
          apt-get install -y \
            git \
            binutils \
            python3 \
            python3-pip \
            clang \
            zip

          python3 -m pip install --upgrade pip importlib-metadata
          python3 -m pip install setuptools==45.2.0

          git clone https://github.com/alliedmodders/ambuild.git /tmp/ambuild
          cd /tmp/ambuild
          pip3 install .

      - name: Download Metamod and CS2 HL2SDK
        run: |
          mkdir -p "$HL2SDK_ROOT"

          git clone --recursive --branch master --single-branch \
            https://github.com/alliedmodders/metamod-source.git \
            "$MMS_PATH"

          git clone --recursive --branch cs2 --single-branch \
            https://github.com/alliedmodders/hl2sdk.git \
            "$HL2SDK_ROOT/hl2sdk-cs2"

      - name: Configure
        run: |
          rm -rf build
          mkdir build
          cd build

          python3 ../configure.py \
            -s cs2 \
            --targets x86_64 \
            --enable-optimize \
            --hl2sdk-manifests="$MMS_PATH/hl2sdk-manifests" \
            --mms_path="$MMS_PATH" \
            --hl2sdk-root="$HL2SDK_ROOT"

      - name: Build
        run: |
          cd build
          ambuild -j 1

      - name: Check undefined KeyValues3
        run: |
          SO="$(find build -type f -name 'vip_viewmodelfov.so' | head -1)"
          test -n "$SO"

          echo "Built: $SO"
          echo "===== undefined KeyValues3 symbols ====="

          if nm -D -u "$SO" | grep -q 'KeyValues3'; then
            nm -D -u "$SO" | grep 'KeyValues3'
            echo "ERROR: plugin still has unresolved KeyValues3 symbols"
            exit 1
          fi

          echo "No unresolved KeyValues3 symbols."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VIP_ViewmodelFOV-linux
          path: build/package
          if-no-files-found: error
          compression-level: 9
