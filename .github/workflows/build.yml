name: Build VIP Weapon Fov

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pisex/ubuntu20:latest

    env:
      HL2SDK_ROOT: ${{ github.workspace }}/external
      MMS_PATH: ${{ github.workspace }}/external/metamod-source

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository layout
        run: |
          echo "WORKSPACE=$GITHUB_WORKSPACE"
          pwd
          find "$GITHUB_WORKSPACE" -maxdepth 2 -type f | sort | head -200

      - name: Install build tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qy
          apt-get install -y \
            git \
            binutils \
            python3 \
            python3-pip \
            build-essential \
            clang \
            protobuf-compiler \
            zip

          python3 -m pip install --upgrade pip importlib-metadata
          python3 -m pip install setuptools==45.2.0

          git clone https://github.com/alliedmodders/ambuild.git /tmp/ambuild
          cd /tmp/ambuild
          pip3 install .

      - name: Clone Metamod and HL2SDK
        run: |
          mkdir -p "$HL2SDK_ROOT"

          git clone --recursive --branch master --single-branch \
            https://github.com/alliedmodders/metamod-source.git \
            "$MMS_PATH"

          git clone --recursive --branch cs2 --single-branch \
            https://github.com/alliedmodders/hl2sdk.git \
            "$HL2SDK_ROOT/hl2sdk-cs2"

      - name: Clone SchemaEntity next to repository
        run: |
          # AMBuilder in this project uses:
          #   ../SchemaEntity
          # relative to the repository source root.
          SCHEMA_DIR="$(dirname "$GITHUB_WORKSPACE")/SchemaEntity"

          rm -rf "$SCHEMA_DIR"
          git clone https://github.com/Pisex/SchemaEntity.git "$SCHEMA_DIR"

          # Compatibility fixes used by Pisex builds.
          sed -i 's/NetworkStateChanged_t/NetworkStateChangedData/g' \
            "$SCHEMA_DIR/schemasystem.cpp"

          sed -i 's/FL_PAWN_FAKECLIENT/FL_FAKECLIENT/g' \
            "$SCHEMA_DIR/CCSPlayerPawn.h"

          sed -i 's/FL_CONTROLLER_FAKECLIENT/FL_FAKECLIENT/g' \
            "$SCHEMA_DIR/CCSPlayerController.h"

          echo "SchemaEntity path: $SCHEMA_DIR"
          ls -la "$SCHEMA_DIR" | head -50

      - name: Verify source files
        run: |
          test -f "$GITHUB_WORKSPACE/configure.py"
          test -f "$GITHUB_WORKSPACE/AMBuildScript"
          test -f "$GITHUB_WORKSPACE/AMBuilder"
          test -f "$GITHUB_WORKSPACE/vip_viewmodelfov.cpp"
          test -f "$GITHUB_WORKSPACE/vip_viewmodelfov.h"
          test -f "$GITHUB_WORKSPACE/hl2sdk-manifests/SdkHelpers.ambuild"

      - name: Configure
        run: |
          rm -rf "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/build"
          cd "$GITHUB_WORKSPACE/build"

          python3 ../configure.py \
            -s cs2 \
            --targets x86_64 \
            --enable-optimize \
            --hl2sdk-manifests="$GITHUB_WORKSPACE/hl2sdk-manifests" \
            --mms_path="$MMS_PATH" \
            --hl2sdk-root="$HL2SDK_ROOT"

      - name: Build
        run: |
          cd "$GITHUB_WORKSPACE/build"
          ambuild

      - name: Show output
        if: always()
        run: |
          echo "=== shared libraries ==="
          find "$GITHUB_WORKSPACE/build" -type f -name "*.so" -print || true
          echo "=== package files ==="
          find "$GITHUB_WORKSPACE/build/package" -type f -print 2>/dev/null || true

      - name: Package artifact
        run: |
          cd "$GITHUB_WORKSPACE/build"

          if [ -d package/addons ]; then
            cd package
            zip -r "$GITHUB_WORKSPACE/VIP_ViewmodelFOV-linux.zip" addons
          else
            mkdir -p "$GITHUB_WORKSPACE/artifact"
            find . -type f \( -name "*.so" -o -name "*.vdf" \) \
              -exec cp -v {} "$GITHUB_WORKSPACE/artifact/" \;
            cd "$GITHUB_WORKSPACE/artifact"
            zip -r "$GITHUB_WORKSPACE/VIP_ViewmodelFOV-linux.zip" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VIP_ViewmodelFOV-linux
          path: VIP_ViewmodelFOV-linux.zip
          if-no-files-found: error